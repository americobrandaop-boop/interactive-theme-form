<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <script src="app.js" defer></script>

    <title>Newsletter</title>
</head>

<body>

    <header class="topo">
        <div class="container">

            <strong>Newsletter</strong>

            <button id="btnTema" class="btn" type="button">
                Alternar tema
            </button>

        </div>
    </header>

    <main class="container">

        <section class="caixa">

            <h1>Inscreva-se</h1>

            <p>Receba novidades no seu e-mail.</p>

            <form id="form-newsletter">

                <label for="nome">Nome</label>

                <input
                    type="text"
                    name="nome"
                    id="nome"
                    placeholder="Seu nome"
                    required
                >

                <label for="email">E-mail</label>

                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="nome@gmail.com"
                    required
                >

                <button type="submit" class="btn primario">
                    Quero receber
                </button>

            </form>

        </section>

    </main>

    <footer class="rodape">
        <div class="container">

            <small>
                Newsletter © <span id="ano"></span>
            </small>

        </div>
    </footer>

</body>

</html>
